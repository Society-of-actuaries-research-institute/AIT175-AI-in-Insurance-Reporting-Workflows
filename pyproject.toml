[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-insurance-reporting"
version = "0.1.0"
description = "A modular Python package demonstrating an AI-enabled insurance management reporting workflow using synthetic data."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
keywords = [
  "insurance",
  "reporting",
  "synthetic-data",
  "streamlit",
  "explainability",
  "etl"
]
dependencies = [
  "pandas>=2.2.0",
  "numpy>=1.26.0",
  "pydantic>=2.7.0",
  "PyYAML>=6.0.1",
  "scikit-learn>=1.5.0",
  "shap>=0.46.0",
  "lime>=0.2.0.1",
  "matplotlib>=3.9.0",
  "plotly>=5.22.0",
  "streamlit>=1.37.0",
  "typer>=0.12.3",
  "rich>=13.7.1"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.5.0",
  "mypy>=1.10.0"
]

[project.scripts]
insurance-reporting = "ai_insurance_reporting.interface.cli:app"
case-study = "ai_insurance_reporting.interface.cli:app"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["ai_insurance_reporting*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-p", "no:cacheprovider"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.mypy]
python_version = "3.13"
packages = ["ai_insurance_reporting"]
ignore_missing_imports = true
